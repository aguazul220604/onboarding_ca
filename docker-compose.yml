version: '3.8'

services:
  backend:
    build:
      context: ./onboarding-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/onboarding_db

  frontend:
    build:
      context: ./onboarding-frontend
    ports:
      - "4200:80" 
    depends_on:
      - backend